apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: herramientas
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "PostgreSQL Bootcamp",
          "Group": "Servers",
          "Host": "postgres.herramientas.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "bootcamp_db",
          "Username": "bootcamp_user",
          "SSLMode": "prefer",
          "PassFile": "/var/lib/pgadmin/.pgpass"
        }
      }
    }
  pgpass: |
    postgres.herramientas.svc.cluster.local:5432:bootcamp_db:bootcamp_user:bootcamp_password_sec2026