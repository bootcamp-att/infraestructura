apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ingress
  namespace: herramientas
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /interno/jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686