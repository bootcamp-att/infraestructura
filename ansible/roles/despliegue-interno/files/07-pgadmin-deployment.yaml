apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: herramientas
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        fsGroup: 5050
        runAsUser: 5050
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@bootcamp.com"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin"
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
            - name: PGADMIN_LISTEN_PORT
              value: "80"
            - name: PGADMIN_SCRIPT_NAME
              value: "/interno/pgadmin"
            - name: SCRIPT_NAME
              value: "/interno/pgadmin"
          volumeMounts:
            - name: servers-config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
            - name: servers-config
              mountPath: /var/lib/pgadmin/.pgpass
              subPath: pgpass
      volumes:
        - name: servers-config
          configMap:
            name: pgadmin-servers
            defaultMode: 0600