apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-deployment
  namespace: apps
  labels:
    app: catalogo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-service
  template:
    metadata:
      labels:
        app: catalogo-service
    spec:
      containers:
      - name: catalogo-container
        image: docker.io/abrahamntd/catalogo-service:1.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        - containerPort: 8091
          name: metrics
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.herramientas.svc.cluster.local:5432/bootcamp_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "bootcamp_user"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "bootcamp_password_sec2026"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: catalogo-service
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  - port: 8091
    targetPort: 8091
    name: metrics