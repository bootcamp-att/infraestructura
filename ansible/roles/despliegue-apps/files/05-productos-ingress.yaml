apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: productos-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: productos-service
                port:
                  number: 8080